name: Deploy demo to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select patched project Node before all tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          # Pin: `latest` tip-of-tree clang can ICE on -msimd128 (shape.c / b3CreateShape).
          # 6.0.2 matches the locally verified toolchain.
          version: 6.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Validate watch behavior and formatter
        run: |
          bun test packages/box3d-wasm/scripts/watch-wasm.test.ts
          bunx oxfmt --version
          bash -n .cursor/install.sh

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build release WASM
        working-directory: packages/box3d-wasm
        env:
          BOX3D_WASM_VARIANT: release
        run: bun run build:wasm

      - name: Check workspace and script types
        run: bun run typecheck

      - name: Smoke test world and slot cleanup
        timeout-minutes: 3
        run: bun run bench:junkyard --frames=1 --warmup=0 --restarts=2 --profile=off

      - name: Build demo
        working-directory: demo
        env:
          VITE_BASE_PATH: "${{ steps.pages.outputs.base_path }}/"
        run: bun run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: demo/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
