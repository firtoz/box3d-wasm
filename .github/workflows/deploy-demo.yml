name: Deploy demo to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          # Pin: `latest` tip-of-tree clang can ICE on -msimd128 (shape.c / b3CreateShape).
          # 6.0.2 matches the locally verified toolchain.
          version: 6.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build release WASM
        working-directory: packages/box3d-wasm
        env:
          BOX3D_WASM_VARIANT: release
        run: bun run build:wasm

      - name: Check workspace and script types
        run: bun run typecheck

      - name: Smoke test world and slot cleanup
        timeout-minutes: 3
        run: bun run bench:junkyard --frames=1 --warmup=0 --restarts=2 --profile=off

      - name: Build demo
        working-directory: demo
        env:
          VITE_BASE_PATH: "${{ steps.pages.outputs.base_path }}/"
        run: bun run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
