[package]
name = "gpu-physics"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Greenfield GPU rigid-body experiment (WGSL compute). Box3D C remains the CPU oracle."

[lib]
name = "gpu_physics"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "gpu-physics"
path = "src/main.rs"

[features]
# Requires the isolated pinned backend extension; not selected by ordinary builds.
native-command-cache = []

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
log = "0.4"
wgpu = "26"

[build-dependencies]
cc = "1"

[dev-dependencies]
# Standalone Vulkan queue-capability probe; no runtime dependency change.
naga = { version = "26", features = ["wgsl-in", "spv-out"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ash = "0.38"
libc = "0.2"
env_logger = "0.11"
pollster = "0.4"
winit = { version = "0.30", features = ["rwh_06"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
            "Document",
            "Element",
            "HtmlCanvasElement",
            "Window",
] }
